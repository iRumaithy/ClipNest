<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F8F0DF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ClipNest">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>ClipNest — محفوظاتي</title>
<style>
:root{
  --bg:#F8F0DF;--bg2:#F3E7D0;--paper:#FFF9ED;--paper2:#FBF2E3;--ink:#584536;--muted:#A08C78;
  --blue:#6E9FD0;--blue-deep:#4E7FAF;--taupe:#A88974;--taupe-deep:#806451;--gold:#C99A4B;--gold2:#DAB56D;
  --line:rgba(102,77,56,.14);--shadow:0 18px 46px rgba(117,84,50,.11);--danger:#B96C69;--nav-h:76px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#EEE2CB;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Arabic","Segoe UI",Tahoma,Arial,sans-serif}
body{position:fixed;inset:0;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
.app{position:relative;width:100%;height:100dvh;max-width:620px;margin:auto;overflow:hidden;background:
 radial-gradient(circle at 12% -3%,rgba(218,181,109,.22),transparent 31%),
 radial-gradient(circle at 94% 7%,rgba(110,159,208,.11),transparent 30%),
 linear-gradient(180deg,#FCF6E9 0%,#F8EFDE 52%,#F7EDDB 100%);display:flex;flex-direction:column}
.top{position:relative;z-index:10;flex:none;padding:calc(env(safe-area-inset-top) + 10px) 15px 7px;background:linear-gradient(180deg,rgba(252,246,233,.99) 0%,rgba(252,246,233,.93) 72%,rgba(252,246,233,0) 100%)}
.brandrow{height:54px;display:flex;direction:ltr;align-items:center;justify-content:space-between}
.brand{direction:rtl;display:flex;align-items:center;gap:10px;text-align:right}.brandlogo{width:43px;height:43px;border-radius:13px;object-fit:cover;display:block;box-shadow:0 7px 18px rgba(100,74,45,.15)}
.brand h1{margin:0;font-size:22px;line-height:1;font-weight:790;letter-spacing:-.3px;color:#5B4638}.brand p{margin:5px 0 0;font-size:11.5px;color:#9C8976}
.menu-btn{width:41px;height:41px;border-radius:14px;border:1px solid var(--line);background:rgba(255,250,239,.88);box-shadow:0 8px 20px rgba(121,91,58,.07);font-size:21px;line-height:1;display:grid;place-items:center;color:#765F4F}
.searchbar{height:52px;display:grid;grid-template-columns:24px minmax(0,1fr) auto;direction:rtl;align-items:center;gap:8px;padding:0 10px 0 8px;border:1px solid var(--line);border-radius:21px;background:rgba(255,250,240,.93);box-shadow:0 12px 30px rgba(119,86,50,.08);backdrop-filter:blur(16px)}
.searchbar svg{color:#AE9884}.searchbar input{border:0;outline:0;background:transparent;font-size:15px;min-width:0;text-align:right}.searchbar input::placeholder{color:#B39B87}
.pastebtn{border:0;border-radius:13px;background:rgba(110,159,208,.15);color:var(--blue-deep);padding:8px 13px;font-size:12px;font-weight:760}
.typefilters{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:10px 0 2px;touch-action:pan-x}.typefilters::-webkit-scrollbar{display:none}
.typechip{flex:none;height:37px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:rgba(255,249,238,.84);font-size:12px;color:#786553;display:flex;align-items:center;gap:6px;white-space:nowrap}.typechip.active{background:var(--blue);border-color:transparent;color:#fff;box-shadow:0 7px 16px rgba(78,127,175,.16)}
.content{flex:1;min-height:0;height:auto;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:8px 15px calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px);scrollbar-width:none}.content::-webkit-scrollbar{display:none}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;margin:5px 2px 10px;gap:12px}.view-title h2{font-size:27px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.4px;color:#604939}.view-title p{margin:6px 0 0;font-size:12px;color:#9C8976}.count{display:inline-flex;margin-top:7px;border:1px solid var(--line);background:rgba(255,249,239,.77);border-radius:999px;padding:6px 11px;font-size:11px;color:#9A8673}
.view-controls{direction:ltr;display:flex;align-items:center;gap:7px}.sortbtn{height:36px;border:0;background:transparent;color:var(--blue-deep);font-size:12px;padding:0 4px;white-space:nowrap}.seg{height:36px;padding:3px;border:1px solid var(--line);background:rgba(255,250,240,.85);border-radius:12px;display:flex}.seg button{width:33px;border:0;border-radius:9px;background:transparent;color:#A38E7B;display:grid;place-items:center}.seg button.active{background:#FFFDF6;box-shadow:0 4px 10px rgba(117,84,50,.09);color:#65503F}
.cards{display:grid;grid-template-columns:1fr;gap:10px}.cards.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cards.grid .actions{flex-wrap:wrap}.cards.grid .preview{-webkit-line-clamp:3}.cards.grid .crumb{max-width:100%}
.card{border:1px solid var(--line);background:linear-gradient(155deg,rgba(255,251,242,.96),rgba(250,239,222,.96));border-radius:20px;padding:13px;box-shadow:0 9px 24px rgba(117,84,50,.07)}.cardtop{display:flex;align-items:flex-start;gap:10px}.typeicon{width:38px;height:38px;flex:none;border-radius:12px;background:rgba(110,159,208,.13);color:var(--blue-deep);display:grid;place-items:center;font-weight:800}.cardmain{min-width:0;flex:1}.titleline{display:flex;align-items:center;gap:7px}.title{font-weight:780;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pin{font-size:9px;color:var(--gold)}.preview{font-size:12.8px;line-height:1.65;color:#8B7564;margin-top:5px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;word-break:break-word;direction:auto;text-align:start}.meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:9px;font-size:10px;color:#A08C78}.crumb,.tag{padding:5px 7px;border-radius:999px;background:rgba(168,137,116,.08)}.crumb{max-width:68%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag{color:#527EAA;background:rgba(110,159,208,.11)}.actions{display:flex;gap:6px;margin-top:10px}.action{border:1px solid var(--line);background:rgba(255,250,240,.84);border-radius:10px;padding:7px 9px;font-size:10.5px}.action.primary{background:rgba(110,159,208,.14);border-color:rgba(78,127,175,.14);color:var(--blue-deep);font-weight:760}.action.danger{color:var(--danger)}
.empty{min-height:224px;border:1px dashed rgba(121,91,58,.18);border-radius:25px;background:rgba(255,251,243,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#A18C78;padding:28px 20px}.empty svg{color:#B7A28E;margin-bottom:13px}.empty b{font-size:18px;color:#6D5646;margin-bottom:8px}.empty span{font-size:13px;line-height:1.8}
.cat-toolbar{display:flex;align-items:center;justify-content:space-between;margin:3px 1px 12px}.cat-toolbar button{border:1px solid var(--line);background:rgba(255,250,240,.86);border-radius:13px;padding:9px 11px;font-size:11.5px}.cat-breadcrumb{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:11px}.crumbbtn{flex:none;border:0;background:transparent;color:var(--blue-deep);font-size:11px;padding:3px}.category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.category-box{min-height:91px;border:1px solid var(--line);border-radius:19px;background:linear-gradient(150deg,rgba(255,250,239,.94),rgba(248,235,216,.88));padding:12px;text-align:right;box-shadow:0 7px 18px rgba(117,84,50,.06)}.category-box .cat-ico{width:34px;height:34px;border-radius:11px;background:rgba(201,154,75,.12);display:grid;place-items:center;margin-bottom:8px;color:#A77934;font-size:18px}.category-box strong{font-size:13px;display:block}.category-box small{display:block;margin-top:4px;color:#A08C78;font-size:10px}
.settings-wrap{display:grid;gap:10px}.settings-card{border:1px solid var(--line);border-radius:20px;background:rgba(255,250,240,.85);padding:14px;box-shadow:0 7px 20px rgba(117,84,50,.05)}.settings-card h3{font-size:14px;margin:0 0 5px}.settings-card p{font-size:11.5px;line-height:1.7;color:#9B8775;margin:0 0 10px}.widebtn{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:#FFF9ED;margin-top:7px;font-size:12px}.widebtn.primary{background:rgba(110,159,208,.14);color:var(--blue-deep);font-weight:760}.version{padding:24px 0 8px;text-align:center;color:#A49180;font-size:10px}.version strong{display:block;color:#6B91B9;font-size:11px;margin-bottom:4px}
.bottomnav{position:absolute;z-index:20;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:5px 9px max(7px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:start;background:rgba(251,244,231,.94);border-top:1px solid rgba(109,83,60,.10);box-shadow:0 -10px 34px rgba(117,84,50,.055);backdrop-filter:blur(18px)}
.navbtn{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding:7px 1px 0;color:#A58D79;font-size:10px;min-width:0}.navbtn svg{width:20px;height:20px}.navbtn.active{color:var(--blue-deep)}.addnav{padding-top:0;color:#947037}.addcircle{width:53px;height:53px;margin-top:-18px;border-radius:18px;background:linear-gradient(145deg,var(--gold2),var(--gold));display:grid;place-items:center;color:white;font-size:30px;font-weight:300;box-shadow:0 10px 23px rgba(172,126,52,.23);border:1px solid rgba(255,255,255,.6)}.addnav span:last-child{margin-top:-1px}
.overlay{position:absolute;inset:0;z-index:40;background:rgba(91,67,48,.17);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:.18s}.overlay.show{opacity:1;pointer-events:auto}.sheet{position:absolute;z-index:41;left:0;right:0;bottom:0;max-height:90dvh;transform:translateY(105%);transition:.25s cubic-bezier(.2,.8,.2,1);background:linear-gradient(180deg,#FFF9ED,#F8ECD9);border-radius:28px 28px 0 0;border:1px solid var(--line);box-shadow:0 -18px 60px rgba(92,67,45,.18);overflow:hidden}.sheet.show{transform:translateY(0)}.grab{width:43px;height:4px;border-radius:999px;background:rgba(112,86,63,.19);margin:8px auto 3px}.sheethead{height:49px;padding:6px 15px;display:flex;align-items:center;justify-content:space-between}.sheethead h3{margin:0;font-size:17px}.close{border:0;width:34px;height:34px;border-radius:11px;background:rgba(255,251,242,.86)}.sheetbody{max-height:calc(90dvh - 55px);overflow-y:auto;overscroll-behavior:contain;padding:4px 15px calc(env(safe-area-inset-bottom) + 18px)}.field{margin:11px 0}.label{display:block;font-size:11px;color:#9B8674;margin:0 2px 6px}.input,.textarea,.select{width:100%;border:1px solid var(--line);border-radius:15px;background:rgba(255,251,243,.89);padding:12px 13px;outline:0}.textarea{min-height:118px;resize:vertical;line-height:1.7;direction:auto;text-align:start}.input:focus,.textarea:focus,.select:focus{border-color:rgba(78,127,175,.38)}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.submit{width:100%;border:0;border-radius:15px;padding:13px;background:linear-gradient(145deg,#7EABD5,#5F8FBE);color:#fff;font-weight:800;margin-top:7px}.ghost{width:100%;border:1px solid var(--line);border-radius:15px;padding:11px;background:rgba(255,250,240,.88);margin-top:7px}.category-tree{display:grid;gap:7px}.catrow{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:rgba(255,250,240,.85);border-radius:14px;padding:8px}.catrow .name{flex:1;border:0;background:transparent;text-align:right;font-size:12px}.dot{width:9px;height:9px;border-radius:50%;background:var(--blue)}.mini{border:0;background:rgba(243,232,214,.88);border-radius:9px;padding:6px 7px;font-size:10px}.toast{position:absolute;z-index:90;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);transform:translate(-50%,15px);opacity:0;pointer-events:none;transition:.2s;background:#FFF8EA;color:#6D503B;border:1px solid var(--line);box-shadow:0 10px 28px rgba(92,67,45,.16);padding:9px 12px;border-radius:12px;font-size:11px;font-weight:760;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:360px){.brand h1{font-size:19px}.typechip{padding:0 10px}.view-title h2{font-size:24px}.category-grid{grid-template-columns:1fr}}
@media(min-width:700px){body{background:#E9DDC7}.app{border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 60px rgba(105,76,47,.10)}}

/* v1.4 taxonomy system */
.tax-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:2px}.tax-field{min-width:0}.tax-field.full{grid-column:1/-1}.picker-field{width:100%;min-height:48px;border:1px solid var(--line);border-radius:15px;background:rgba(255,251,243,.91);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:right}.picker-field .pf-main{min-width:0;display:flex;align-items:center;gap:8px}.picker-field .pf-icon{width:27px;height:27px;border-radius:9px;background:rgba(110,159,208,.10);color:var(--blue-deep);display:grid;place-items:center;flex:none;font-size:13px}.picker-field .pf-text{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;font-weight:680;color:#654F40}.picker-field .pf-arrow{color:#B19B87;font-size:17px;line-height:1}.picker-field.disabled{opacity:.56;pointer-events:none}.tax-hint{margin:7px 2px 0;color:#A08C78;font-size:10.5px;line-height:1.55}.picker-options{display:grid;gap:7px}.picker-option{width:100%;min-height:47px;border:1px solid var(--line);border-radius:14px;background:rgba(255,251,243,.91);display:flex;align-items:center;gap:10px;padding:9px 11px;text-align:right}.picker-option .po-icon{width:31px;height:31px;border-radius:10px;background:rgba(110,159,208,.10);display:grid;place-items:center;color:var(--blue-deep);font-size:15px;flex:none}.picker-option .po-name{flex:1;min-width:0;font-size:13px;font-weight:670}.picker-option .po-check{width:22px;color:var(--blue-deep);font-weight:900}.picker-option.selected{border-color:rgba(78,127,175,.31);background:rgba(238,246,252,.78)}.picker-add{margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}.picker-add-row{display:flex;gap:7px}.picker-add-row .input{flex:1;min-width:0}.picker-add-row button{border:0;border-radius:13px;padding:0 15px;background:linear-gradient(145deg,#7EABD5,#5F8FBE);color:#fff;font-weight:780}.filter-panel{border:1px solid var(--line);background:rgba(255,250,240,.72);border-radius:18px;padding:10px;margin:3px 0 12px}.filter-line+.filter-line{margin-top:9px}.filter-label{font-size:10.5px;color:#9C8875;margin:0 1px 6px}.filter-scroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}.filter-scroll::-webkit-scrollbar{display:none}.taxchip{flex:none;border:1px solid var(--line);border-radius:999px;background:rgba(255,252,245,.86);padding:7px 10px;font-size:11px;color:#7D6757;white-space:nowrap}.taxchip.active{background:rgba(110,159,208,.14);border-color:rgba(78,127,175,.24);color:var(--blue-deep);font-weight:730}.taxchip.city.active{background:rgba(201,154,75,.13);border-color:rgba(201,154,75,.24);color:#9A6C2B}.taxonomy-list{display:grid;gap:9px}.taxonomy-primary{border:1px solid var(--line);border-radius:17px;background:rgba(255,250,240,.86);padding:11px}.taxonomy-primary-head{display:flex;align-items:center;gap:8px}.taxonomy-primary-head .tp-icon{width:34px;height:34px;border-radius:11px;background:rgba(110,159,208,.10);display:grid;place-items:center;color:var(--blue-deep);font-size:16px}.taxonomy-primary-head .tp-name{flex:1;font-weight:760;font-size:13px}.taxonomy-primary-head small{color:#A08C78;font-size:10px}.taxonomy-secondary{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;padding-top:9px;border-top:1px solid rgba(102,77,56,.08)}.secondary-pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;background:rgba(243,232,214,.72);padding:6px 8px;font-size:10.5px;color:#7D6757}.secondary-pill button{border:0;background:transparent;color:#B96C69;padding:0 2px}.manage-block{border:1px solid var(--line);border-radius:18px;background:rgba(255,250,240,.78);padding:12px;margin-top:12px}.manage-block h4{font-size:12.5px;margin:0 0 9px}.manage-parent{margin-bottom:8px}.location-badge{display:inline-flex;align-items:center;gap:4px;color:#986D35;background:rgba(201,154,75,.10);padding:5px 8px;border-radius:999px}.taxonomy-empty{font-size:11px;color:#A08C78}.card .meta .crumb{max-width:56%}#pickerSheet{z-index:45}
</style>
</head>
<body>
<div class="app" id="app">
<header class="top">
  <div class="brandrow">
    <button class="menu-btn" id="menuBtn" aria-label="الإعدادات">•••</button>
    <div class="brand"><img src="./icon-192.png" class="brandlogo" alt="ClipNest"><div><h1>ClipNest</h1><p>كل ما تحتاجه، محفوظ في مكانه.</p></div></div>
  </div>
  <div class="searchbar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="m21 21-4.4-4.4m2.4-5.1A7.5 7.5 0 1 1 4 11.5a7.5 7.5 0 0 1 15 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="search" type="search" placeholder="إبحث في كل محفوظاتك…" autocomplete="off">
    <button class="pastebtn" id="pasteBtn">لصق</button>
  </div>
  <div class="typefilters" id="typeFilters"></div>
</header>
<main class="content" id="content"><div id="mainArea"></div></main>
<nav class="bottomnav" id="bottomNav">
  <button class="navbtn active" data-view="all"><svg viewBox="0 0 24 24" fill="none"><path d="M4 10.5 12 4l8 6.5V20H5v-9.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>الكل</span></button>
  <button class="navbtn" data-view="categories"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="4" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="14" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.8"/></svg><span>التصنيفات</span></button>
  <button class="navbtn addnav" id="addNav"><span class="addcircle">＋</span><span>إضافة</span></button>
  <button class="navbtn" data-view="favorites"><svg viewBox="0 0 24 24" fill="none"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.8 1-6.1-4.4-4.3 6.1-.9L12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>المفضلة</span></button>
  <button class="navbtn" data-view="settings"><svg viewBox="0 0 24 24" fill="none"><path d="M12 8.3a3.7 3.7 0 1 0 0 7.4 3.7 3.7 0 0 0 0-7.4Z" stroke="currentColor" stroke-width="1.8"/><path d="M19 13.5v-3l-2-.6a7 7 0 0 0-.7-1.6l1-1.8-2.1-2.1-1.8 1a7 7 0 0 0-1.6-.7L11.2 3h-3l-.6 1.7a7 7 0 0 0-1.6.7l-1.8-1L2.1 6.5l1 1.8a7 7 0 0 0-.7 1.6l-1.7.6v3l1.7.6c.2.6.4 1.1.7 1.6l-1 1.8 2.1 2.1 1.8-1c.5.3 1 .5 1.6.7l.6 1.7h3l.6-1.7c.6-.2 1.1-.4 1.6-.7l1.8 1 2.1-2.1-1-1.8c.3-.5.5-1 .7-1.6l2-.6Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" transform="translate(2.1 0) scale(.82)"/></svg><span>الإعدادات</span></button>
</nav>
<div class="overlay" id="overlay"></div>

<section class="sheet" id="itemSheet"><div class="grab"></div><div class="sheethead"><h3 id="itemSheetTitle">إضافة محفوظ جديد</h3><button class="close" data-close>✕</button></div><div class="sheetbody">
  <input type="hidden" id="itemId"><input type="hidden" id="itemPrimary"><input type="hidden" id="itemSecondary"><input type="hidden" id="itemCity">
  <div class="field"><label class="label">العنوان <span style="opacity:.65">(اختياري)</span></label><input class="input" id="itemTitle" placeholder="مثال: رابط لوحة التحكم"></div>
  <div class="field"><label class="label">المحتوى</label><textarea class="textarea" id="itemContent" placeholder="الصق رابطًا، جملة، كودًا أو أي معلومة…"></textarea></div>
  <div class="field"><label class="label">تنظيم المحفوظ</label>
    <div class="tax-grid">
      <div class="tax-field"><button class="picker-field" id="primaryField"><span class="pf-main"><span class="pf-icon">◫</span><span class="pf-text" id="primaryText">غير مصنف</span></span><span class="pf-arrow">‹</span></button></div>
      <div class="tax-field"><button class="picker-field disabled" id="secondaryField"><span class="pf-main"><span class="pf-icon">≡</span><span class="pf-text" id="secondaryText">اختر الأساسي أولًا</span></span><span class="pf-arrow">‹</span></button></div>
      <div class="tax-field full"><button class="picker-field" id="cityField"><span class="pf-main"><span class="pf-icon">⌖</span><span class="pf-text" id="cityText">بدون مدينة</span></span><span class="pf-arrow">‹</span></button></div>
    </div><div class="tax-hint">المدينة مستقلة عن التصنيف. مثال: أكل ← مطعم + أبوظبي.</div>
  </div>

  <div class="row2"><button class="ghost" id="favoriteToggle">☆ إضافة للمفضلة</button><button class="ghost" id="pinToggle">⌁ تثبيت بالأعلى</button></div><button class="submit" id="saveItem">حفظ</button>
</div></section>

<section class="sheet" id="pickerSheet"><div class="grab"></div><div class="sheethead"><h3 id="pickerTitle">اختيار</h3><button class="close" id="pickerClose">✕</button></div><div class="sheetbody">

  <div class="taxonomy-list" id="taxonomyManageList"></div>
  <div class="manage-block"><h4>إضافة تصنيف أساسي</h4><div class="picker-add-row"><input class="input" id="newPrimaryName" placeholder="مثال: عطور"><button id="addPrimaryBtn">إضافة</button></div></div>
  <div class="manage-block"><h4>إضافة تصنيف ثانوي</h4><button class="picker-field manage-parent" id="manageParentField"><span class="pf-main"><span class="pf-icon">◫</span><span class="pf-text" id="manageParentText">اختر التصنيف الأساسي</span></span><span class="pf-arrow">‹</span></button><div class="picker-add-row"><input class="input" id="newSecondaryName" placeholder="مثال: مطعم"><button id="addSecondaryBtn">إضافة</button></div></div>
</div></section>

<script>(()=>{'use strict';
const VERSION='1.4.0',DB_NAME='clipnestDB',DB_VERSION=2;
const DEFAULT_CITIES=['أبوظبي','دبي','الشارقة','عجمان','أم القيوين','رأس الخيمة','الفجيرة','العين'];
const PRIMARY_DEFAULTS=[
  ['أكل','#C99A4B','🍴'],['كمبيوتر','#6E9FD0','⌘'],['مواقع','#6E9FD0','↗'],['عمل','#A88974','▣'],['شخصي','#A88974','◇'],['سيارات','#C99A4B','◈'],['سفر','#6E9FD0','✈'],['تسوق','#C99A4B','⌑'],['معلومات عامة','#A88974','≡']
];
const SECONDARY_DEFAULTS={
 'أكل':['مطعم','كوفي','حلويات','مخبز'],
 'كمبيوتر':['برامج','أدوات','أكواد','حلول'],
 'مواقع':['أدوات','ذكاء اصطناعي','خدمات','تسوق'],
 'عمل':['مهام','أنظمة','روابط','مستندات'],
 'شخصي':['ملاحظات','روابط','أرقام'],
 'سيارات':['صيانة','قطع غيار','مواقع','معارض'],
 'سفر':['فنادق','أماكن','حجوزات','مواصلات'],
 'تسوق':['متاجر','منتجات','عروض'],
 'معلومات عامة':['ملاحظات','أرقام','روابط']
};
let db,items=[],legacyCategories=[],primaryCategories=[],secondaryCategories=[],cities=[];
let currentView='all',currentPrimary=null,currentSecondary=null,currentCity=null,currentType='all',viewMode='list',sortNewest=true;
let editFavorite=false,editPinned=false,deferredPrompt=null,pickerMode=null,managePrimaryId=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2),now=()=>new Date().toISOString();
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1450)}
['gesturestart','gesturechange','gestureend'].forEach(x=>document.addEventListener(x,e=>e.preventDefault(),{passive:false}));document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('items'))d.createObjectStore('items',{keyPath:'id'});if(!d.objectStoreNames.contains('categories'))d.createObjectStore('categories',{keyPath:'id'});if(!d.objectStoreNames.contains('primaryCategories'))d.createObjectStore('primaryCategories',{keyPath:'id'});if(!d.objectStoreNames.contains('secondaryCategories'))d.createObjectStore('secondaryCategories',{keyPath:'id'});if(!d.objectStoreNames.contains('cities'))d.createObjectStore('cities',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}
function store(n,m='readonly'){return db.transaction(n,m).objectStore(n)}
function getAll(n){return new Promise((res,rej)=>{const r=store(n).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function put(n,v){return new Promise((res,rej)=>{const r=store(n,'readwrite').put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function del(n,id){return new Promise((res,rej)=>{const r=store(n,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function clearStore(n){return new Promise((res,rej)=>{const r=store(n,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function ensurePrimary(name,color='#A88974',icon='◫',system=false){let c=primaryCategories.find(x=>x.name===name);if(c)return c;c={id:uid(),name,color,icon,system,createdAt:now()};await put('primaryCategories',c);primaryCategories.push(c);return c}
async function ensureSecondary(parentId,name,system=false){let c=secondaryCategories.find(x=>x.parentId===parentId&&x.name===name);if(c)return c;c={id:uid(),parentId,name,system,createdAt:now()};await put('secondaryCategories',c);secondaryCategories.push(c);return c}
async function ensureCity(name,system=false){let c=cities.find(x=>x.name===name);if(c)return c;c={id:uid(),name,system,createdAt:now()};await put('cities',c);cities.push(c);return c}
async function seedTaxonomy(){primaryCategories=await getAll('primaryCategories');secondaryCategories=await getAll('secondaryCategories');cities=await getAll('cities');for(const [name,color,icon] of PRIMARY_DEFAULTS){const p=await ensurePrimary(name,color,icon,true);for(const s of (SECONDARY_DEFAULTS[name]||[]))await ensureSecondary(p.id,s,true)}for(const city of DEFAULT_CITIES)await ensureCity(city,true);primaryCategories=await getAll('primaryCategories');secondaryCategories=await getAll('secondaryCategories');cities=await getAll('cities')}
function legacyCatById(id){return legacyCategories.find(c=>c.id===id)}
function legacyPath(id){if(!id)return[];const p=[];let c=legacyCatById(id),g=0;while(c&&g++<30){p.unshift(c.name);c=legacyCatById(c.parentId)}return p}
function pById(id){return primaryCategories.find(x=>x.id===id)}function sById(id){return secondaryCategories.find(x=>x.id===id)}function cityById(id){return cities.find(x=>x.id===id)}
function secondariesFor(pid){return secondaryCategories.filter(x=>x.parentId===pid).sort((a,b)=>a.name.localeCompare(b.name,'ar'))}function orderedCities(){return [...cities].sort((a,b)=>{const ia=DEFAULT_CITIES.indexOf(a.name),ib=DEFAULT_CITIES.indexOf(b.name);if(ia>=0&&ib>=0)return ia-ib;if(ia>=0)return-1;if(ib>=0)return 1;return a.name.localeCompare(b.name,'ar')})}
async function migrateLegacyItems(){let changed=false;for(const i of items){if(i.primaryCategoryId!==undefined)continue;const path=legacyPath(i.categoryId);let p=null,s=null,c=null;if(path.length){p=await ensurePrimary(path[0], '#A88974','◫',false);const cityName=path.find(n=>DEFAULT_CITIES.includes(n));if(cityName)c=await ensureCity(cityName,true);let secName=path.slice(1).find(n=>!DEFAULT_CITIES.includes(n));if(secName){if(secName==='مطاعم')secName='مطعم';if(secName==='كوفيات')secName='كوفي';s=await ensureSecondary(p.id,secName,false)}}i.primaryCategoryId=p?.id||null;i.secondaryCategoryId=s?.id||null;i.cityId=c?.id||null;await put('items',i);changed=true}if(changed)items=await getAll('items');primaryCategories=await getAll('primaryCategories');secondaryCategories=await getAll('secondaryCategories');cities=await getAll('cities')}
function detectType(content){const s=(content||'').trim();if(/^https?:\/\/\S+$/i.test(s))return'link';if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s))return'email';if(/^[+\d][\d\s()-]{6,}$/.test(s))return'phone';if((s.includes('{')&&s.includes('}'))||/<\/?[a-z][\s\S]*>/i.test(s)||/\b(const|let|function|SELECT|INSERT|class)\b/.test(s))return'code';return'text'}
function typeLabel(t){return({link:'رابط',email:'بريد',phone:'رقم',code:'كود',text:'نص'})[t]||'نص'}function typeIcon(t){return({link:'↗',email:'@',phone:'☎',code:'⌘',text:'≡'})[t]||'≡'}
function autoTitle(c,t){const s=(c||'').trim();if(t==='link'){try{return new URL(s).hostname.replace(/^www\./,'')}catch{}}if(t==='email')return s.split('@')[1]||'بريد إلكتروني';return s.split(/\n/)[0].trim().slice(0,48)||'محفوظ جديد'}
function fmtDate(iso){const d=new Date(iso),n=new Date(),diff=(n-d)/864e5;if(diff<1&&n.getDate()===d.getDate())return'اليوم';if(diff<2)return'أمس';return d.toLocaleDateString('ar-AE',{day:'numeric',month:'short'})}
function taxonomyText(i){const a=[];const p=pById(i.primaryCategoryId),s=sById(i.secondaryCategoryId);if(p)a.push(p.name);if(s)a.push(s.name);return a.join(' › ')||'غير مصنف'}
function countPrimary(id){return items.filter(i=>i.primaryCategoryId===id).length}function countSecondary(id){return items.filter(i=>i.secondaryCategoryId===id).length}
function typeMatch(i){if(currentType==='all')return true;if(currentType==='contact')return['email','phone'].includes(i.type);return i.type===currentType}
function filteredItems(){let a=[...items],q=$('#search').value.trim().toLowerCase();if(currentView==='favorites')a=a.filter(i=>i.favorite);if(currentPrimary)a=a.filter(i=>i.primaryCategoryId===currentPrimary);if(currentSecondary)a=a.filter(i=>i.secondaryCategoryId===currentSecondary);if(currentCity)a=a.filter(i=>i.cityId===currentCity);a=a.filter(typeMatch);if(q)a=a.filter(i=>[i.title,i.content,(i.tags||[]).join(' '),taxonomyText(i),cityById(i.cityId)?.name||'',typeLabel(i.type)].join(' ').toLowerCase().includes(q));a.sort((x,y)=>{if(!!x.pinned!==!!y.pinned)return x.pinned?-1:1;const ax=new Date(x.updatedAt||x.createdAt),by=new Date(y.updatedAt||y.createdAt);return sortNewest?by-ax:ax-by});return a}
function renderTypeFilters(){const defs=[['all','الكل',''],['link','روابط','↗'],['text','نصوص','≡'],['code','أكواد','⌘'],['contact','بيانات','@']];$('#typeFilters').innerHTML=defs.map(([k,l,i])=>`<button class="typechip ${currentType===k?'active':''}" data-type="${k}">${i?`<span>${i}</span>`:''}${l}</button>`).join('')}
function trayIcon(){return'<svg width="54" height="54" viewBox="0 0 64 64" fill="none"><path d="M14 18h36l6 23v8a5 5 0 0 1-5 5H13a5 5 0 0 1-5-5v-8l6-23Z" stroke="currentColor" stroke-width="3"/><path d="M9 41h15l4 6h8l4-6h15" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg>'}
function cardHTML(i){const city=cityById(i.cityId);return`<article class="card"><div class="cardtop"><div class="typeicon">${typeIcon(i.type)}</div><div class="cardmain"><div class="titleline"><div class="title">${esc(i.title||autoTitle(i.content,i.type))}</div>${i.pinned?'<span class="pin">مثبّت</span>':''}</div><div class="preview">${esc(i.content)}</div><div class="meta"><span class="crumb">${esc(taxonomyText(i))}</span>${city?`<span class="location-badge">⌖ ${esc(city.name)}</span>`:''}${(i.tags||[]).slice(0,2).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}<span>${fmtDate(i.updatedAt||i.createdAt)}</span></div></div></div><div class="actions"><button class="action primary" data-copy="${i.id}">نسخ</button>${i.type==='link'?`<button class="action" data-open="${i.id}">فتح</button>`:''}<button class="action" data-fav="${i.id}">${i.favorite?'★':'☆'}</button><button class="action" data-edit="${i.id}">تعديل</button><button class="action danger" data-delete="${i.id}">حذف</button></div></article>`}
function itemView(title,sub){const a=filteredItems();return`<div class="view-head"><div class="view-title"><h2>${title}</h2><p>${sub}</p><span class="count">${a.length} عنصر</span></div><div class="view-controls"><div class="seg"><button data-mode="list" class="${viewMode==='list'?'active':''}" aria-label="قائمة">☷</button><button data-mode="grid" class="${viewMode==='grid'?'active':''}" aria-label="شبكة">⊞</button></div><button class="sortbtn" id="sortBtn">${sortNewest?'↓ الأحدث':'↑ الأقدم'}</button></div></div>${a.length?`<div class="cards ${viewMode==='grid'?'grid':''}" id="cards">${a.map(cardHTML).join('')}</div>`:`<div class="empty">${trayIcon()}<b>لا توجد نتائج</b><span>${$('#search').value?'جرّب كلمة أخرى أو غيّر الفلتر.':'اضغط + لإضافة أول محفوظ.'}</span></div>`}`}
function catIcon(name){return pById(primaryCategories.find(x=>x.name===name)?.id)?.icon||'◫'}
function categoryPage(){const q=$('#search').value.trim();if(q)return itemView('نتائج البحث','البحث شامل التصنيف والمدينة والوسوم');if(!currentPrimary){return`<div class="view-head"><div class="view-title"><h2>التصنيفات</h2><p>التصنيف الأساسي منفصل عن النوع والمدينة</p><span class="count">${items.length} عنصر</span></div></div><div class="cat-toolbar"><button id="manageCategories">＋ إدارة التصنيفات</button><span></span></div><div class="category-grid">${primaryCategories.sort((a,b)=>a.name.localeCompare(b.name,'ar')).map(p=>`<button class="category-box" data-primary-card="${p.id}"><span class="cat-ico">${esc(p.icon||'◫')}</span><strong>${esc(p.name)}</strong><small>${countPrimary(p.id)} عنصر • ${secondariesFor(p.id).length} تصنيف ثانوي</small></button>`).join('')}</div>`}const p=pById(currentPrimary),secs=secondariesFor(currentPrimary),a=filteredItems();return`<div class="view-head"><div class="view-title"><h2>${esc(p?.name||'التصنيف')}</h2><p>اختر النوع الثانوي والمدينة كفلاتر مستقلة</p><span class="count">${a.length} عنصر</span></div></div><div class="cat-toolbar"><button id="manageCategories">＋ إدارة التصنيفات</button><button id="catBack">‹ رجوع</button></div><div class="filter-panel"><div class="filter-line"><div class="filter-label">التصنيف الثانوي</div><div class="filter-scroll"><button class="taxchip ${!currentSecondary?'active':''}" data-secondary-filter="">الكل</button>${secs.map(s=>`<button class="taxchip ${currentSecondary===s.id?'active':''}" data-secondary-filter="${s.id}">${esc(s.name)} <span style="opacity:.55">${countSecondary(s.id)}</span></button>`).join('')}</div></div><div class="filter-line"><div class="filter-label">المدينة</div><div class="filter-scroll"><button class="taxchip city ${!currentCity?'active':''}" data-city-filter="">كل المدن</button>${orderedCities().map(c=>`<button class="taxchip city ${currentCity===c.id?'active':''}" data-city-filter="${c.id}">${esc(c.name)}</button>`).join('')}</div></div></div>${a.length?`<div class="cards ${viewMode==='grid'?'grid':''}" id="cards">${a.map(cardHTML).join('')}</div>`:`<div class="empty">${trayIcon()}<b>لا توجد نتائج</b><span>غيّر النوع الثانوي أو المدينة، أو أضف محفوظًا جديدًا لهذا التصنيف.</span></div>`}`}
function settingsPage(){return`<div class="view-head"><div class="view-title"><h2>الإعدادات</h2><p>النسخ الاحتياطي، التثبيت وإدارة البيانات</p></div></div><div class="settings-wrap"><div class="settings-card"><h3>نسخة احتياطية</h3><p>تصدير المحفوظات والتصنيفات والمدن في ملف واحد واستعادتها لاحقًا.</p><button class="widebtn primary" id="exportBtn">تصدير نسخة JSON</button><button class="widebtn" id="importBtn">استيراد نسخة</button></div><div class="settings-card"><h3>تثبيت كتطبيق</h3><p>عند إضافته للشاشة الرئيسية يعمل ClipNest بواجهة مستقلة وبدون شريط المتصفح.</p><button class="widebtn" id="installBtn">طريقة التثبيت</button></div><div class="settings-card"><h3>إعادة ضبط</h3><p>يحذف جميع بيانات ClipNest من هذا الجهاز فقط.</p><button class="widebtn" id="clearBtn" style="color:#B96C69">حذف جميع البيانات</button></div></div><div class="version"><strong>ClipNest v${VERSION}</strong>كل ما تحتاجه، محفوظ في مكانه.</div>`}
function updateNav(){$$('.navbtn[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===currentView))}
function render(){renderTypeFilters();updateNav();let html;if(currentView==='categories')html=categoryPage();else if(currentView==='settings')html=settingsPage();else if(currentView==='favorites')html=itemView('المفضلة','المحفوظات التي تريد الوصول إليها بسرعة');else html=itemView('المحفوظات','روابط، نصوص ومعلوماتك المهمة');$('#mainArea').innerHTML=html;wireDynamic()}
function wireDynamic(){const sort=$('#sortBtn');if(sort)sort.onclick=()=>{sortNewest=!sortNewest;render()};$$('[data-mode]').forEach(b=>b.onclick=()=>{viewMode=b.dataset.mode;render()});const manage=$('#manageCategories');if(manage)manage.onclick=openCategories;const back=$('#catBack');if(back)back.onclick=()=>{currentPrimary=null;currentSecondary=null;currentCity=null;render()};$$('[data-primary-card]').forEach(b=>b.onclick=()=>{currentPrimary=b.dataset.primaryCard;currentSecondary=null;currentCity=null;render()});$$('[data-secondary-filter]').forEach(b=>b.onclick=()=>{currentSecondary=b.dataset.secondaryFilter||null;render()});$$('[data-city-filter]').forEach(b=>b.onclick=()=>{currentCity=b.dataset.cityFilter||null;render()});const cards=$('#cards');if(cards)cards.onclick=handleCardClick;const ex=$('#exportBtn');if(ex)ex.onclick=exportBackup;const im=$('#importBtn');if(im)im.onclick=()=>$('#importFile').click();const ins=$('#installBtn');if(ins)ins.onclick=installApp;const cl=$('#clearBtn');if(cl)cl.onclick=clearAll}
function showSheet(id){$('#overlay').classList.add('show');$(id).classList.add('show')}function closeSheets(){$('#overlay').classList.remove('show');$$('.sheet').forEach(s=>s.classList.remove('show'))}
function updateItemTaxLabels(){const p=pById($('#itemPrimary').value),s=sById($('#itemSecondary').value),c=cityById($('#itemCity').value);$('#primaryText').textContent=p?.name||'غير مصنف';$('#secondaryText').textContent=p?(s?.name||'بدون تصنيف ثانوي'):'اختر الأساسي أولًا';$('#secondaryField').classList.toggle('disabled',!p);$('#cityText').textContent=c?.name||'بدون مدينة'}
function openItem(item=null){$('#itemId').value=item?.id||'';$('#itemTitle').value=item?.title||'';$('#itemContent').value=item?.content||'';$('#itemPrimary').value=item?.primaryCategoryId||currentPrimary||'';$('#itemSecondary').value=item?.secondaryCategoryId||currentSecondary||'';$('#itemCity').value=item?.cityId||currentCity||'';$('#itemTags').value=(item?.tags||[]).join('، ');editFavorite=!!item?.favorite;editPinned=!!item?.pinned;$('#favoriteToggle').textContent=editFavorite?'★ في المفضلة':'☆ إضافة للمفضلة';$('#pinToggle').textContent=editPinned?'⌁ مثبّت':'⌁ تثبيت بالأعلى';$('#itemSheetTitle').textContent=item?'تعديل المحفوظ':'إضافة محفوظ جديد';updateItemTaxLabels();showSheet('#itemSheet');setTimeout(()=>$('#itemContent').focus(),230)}
function pickerIcon(mode,obj){if(mode==='city')return'⌖';if(mode==='secondary')return'≡';if(mode==='primary'||mode==='managePrimary')return obj?.icon||'◫';return'◫'}
function openPicker(mode){pickerMode=mode;if(mode==='secondary'&&!$('#itemPrimary').value)return toast('اختر التصنيف الأساسي أولًا');let title='',list=[],selected='',noneLabel='';if(mode==='primary'){title='التصنيف الأساسي';list=primaryCategories;selected=$('#itemPrimary').value;noneLabel='غير مصنف'}else if(mode==='secondary'){title='التصنيف الثانوي';list=secondariesFor($('#itemPrimary').value);selected=$('#itemSecondary').value;noneLabel='بدون تصنيف ثانوي'}else if(mode==='city'){title='المدينة';list=orderedCities();selected=$('#itemCity').value;noneLabel='بدون مدينة'}else if(mode==='managePrimary'){title='اختر التصنيف الأساسي';list=primaryCategories;selected=managePrimaryId;noneLabel=''}$('#pickerTitle').textContent=title;let html=noneLabel?`<button class="picker-option ${!selected?'selected':''}" data-pick=""><span class="po-icon">—</span><span class="po-name">${noneLabel}</span><span class="po-check">${!selected?'✓':''}</span></button>`:'';if(mode!=='city')list=[...list].sort((a,b)=>a.name.localeCompare(b.name,'ar'));html+=list.map(o=>`<button class="picker-option ${selected===o.id?'selected':''}" data-pick="${o.id}"><span class="po-icon">${pickerIcon(mode,o)}</span><span class="po-name">${esc(o.name)}</span><span class="po-check">${selected===o.id?'✓':''}</span></button>`).join('');$('#pickerOptions').innerHTML=html;$('#pickerAddLabel').textContent=mode==='city'?'إضافة مدينة أخرى':mode==='secondary'?'إضافة تصنيف ثانوي جديد':mode==='managePrimary'?'إضافة تصنيف أساسي جديد':'إضافة تصنيف أساسي جديد';$('#pickerNewName').placeholder=mode==='city'?'مثال: مدينة أخرى':mode==='secondary'?'مثال: مطعم':'مثال: عطور';$('#pickerNewName').value='';showSheet('#pickerSheet')}
function applyPick(id){if(pickerMode==='primary'){$('#itemPrimary').value=id;if($('#itemSecondary').value&&sById($('#itemSecondary').value)?.parentId!==id)$('#itemSecondary').value='';updateItemTaxLabels()}else if(pickerMode==='secondary'){$('#itemSecondary').value=id;updateItemTaxLabels()}else if(pickerMode==='city'){$('#itemCity').value=id;updateItemTaxLabels()}else if(pickerMode==='managePrimary'){managePrimaryId=id;$('#manageParentText').textContent=pById(id)?.name||'اختر التصنيف الأساسي'}$('#pickerSheet').classList.remove('show')}
async function addFromPicker(){const name=$('#pickerNewName').value.trim();if(!name)return toast('اكتب الاسم أولًا');let obj;if(pickerMode==='city')obj=await ensureCity(name,false);else if(pickerMode==='secondary')obj=await ensureSecondary($('#itemPrimary').value,name,false);else obj=await ensurePrimary(name,'#A88974','◫',false);primaryCategories=await getAll('primaryCategories');secondaryCategories=await getAll('secondaryCategories');cities=await getAll('cities');applyPick(obj.id);toast('تمت الإضافة')}
async function saveItem(){const content=$('#itemContent').value.trim();if(!content)return toast('اكتب أو الصق محتوى أولًا');const id=$('#itemId').value||uid(),old=items.find(i=>i.id===id),type=detectType(content),obj={...old,id,title:$('#itemTitle').value.trim()||autoTitle(content,type),content,primaryCategoryId:$('#itemPrimary').value||null,secondaryCategoryId:$('#itemSecondary').value||null,cityId:$('#itemCity').value||null,tags:$('#itemTags').value.split(/[،,]/).map(x=>x.trim()).filter(Boolean),type,favorite:editFavorite,pinned:editPinned,createdAt:old?.createdAt||now(),updatedAt:now(),copyCount:old?.copyCount||0,copiedAt:old?.copiedAt||null};await put('items',obj);items=await getAll('items');closeSheets();render();toast('تم الحفظ')}
async function copyItem(id){const i=items.find(x=>x.id===id);if(!i)return;try{await navigator.clipboard.writeText(i.content)}catch{const t=document.createElement('textarea');t.value=i.content;t.style.position='fixed';t.style.opacity=0;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}i.copyCount=(i.copyCount||0)+1;i.copiedAt=now();await put('items',i);toast('تم النسخ')}
async function pasteClipboard(){try{const txt=await navigator.clipboard.readText();openItem();if(txt){$('#itemContent').value=txt;$('#itemTitle').value=autoTitle(txt,detectType(txt))}}catch{openItem();toast('الصق المحتوى داخل الخانة')}}
async function handleCardClick(e){const b=e.target.closest('[data-copy],[data-open],[data-fav],[data-edit],[data-delete]');if(!b)return;const d=b.dataset;if(d.copy)return copyItem(d.copy);if(d.open){const i=items.find(x=>x.id===d.open);if(i)window.open(i.content,'_blank','noopener')}if(d.fav){const i=items.find(x=>x.id===d.fav);i.favorite=!i.favorite;i.updatedAt=now();await put('items',i);items=await getAll('items');render();toast(i.favorite?'أضيف للمفضلة':'أزيل من المفضلة')}if(d.edit)openItem(items.find(x=>x.id===d.edit));if(d.delete&&confirm('حذف هذا المحفوظ؟')){await del('items',d.delete);items=await getAll('items');render();toast('تم الحذف')}}
function renderManageTaxonomy(){const box=$('#taxonomyManageList');box.innerHTML=primaryCategories.sort((a,b)=>a.name.localeCompare(b.name,'ar')).map(p=>{const ss=secondariesFor(p.id);return`<div class="taxonomy-primary"><div class="taxonomy-primary-head"><span class="tp-icon">${esc(p.icon||'◫')}</span><span class="tp-name">${esc(p.name)}</span><small>${countPrimary(p.id)} عنصر</small>${!p.system?`<button class="mini" data-del-primary="${p.id}" style="color:#B96C69">حذف</button>`:''}</div><div class="taxonomy-secondary">${ss.length?ss.map(s=>`<span class="secondary-pill">${esc(s.name)}${!s.system?`<button data-del-secondary="${s.id}">✕</button>`:''}</span>`).join(''):'<span class="taxonomy-empty">لا توجد تصنيفات ثانوية بعد</span>'}</div></div>`}).join('')}
function openCategories(){renderManageTaxonomy();managePrimaryId=null;$('#manageParentText').textContent='اختر التصنيف الأساسي';$('#newPrimaryName').value='';$('#newSecondaryName').value='';showSheet('#categorySheet')}
async function addPrimaryManage(){const name=$('#newPrimaryName').value.trim();if(!name)return toast('اكتب اسم التصنيف الأساسي');await ensurePrimary(name,'#A88974','◫',false);primaryCategories=await getAll('primaryCategories');$('#newPrimaryName').value='';renderManageTaxonomy();render();toast('تمت الإضافة')}
async function addSecondaryManage(){const name=$('#newSecondaryName').value.trim();if(!managePrimaryId)return toast('اختر التصنيف الأساسي');if(!name)return toast('اكتب اسم التصنيف الثانوي');await ensureSecondary(managePrimaryId,name,false);secondaryCategories=await getAll('secondaryCategories');$('#newSecondaryName').value='';renderManageTaxonomy();render();toast('تمت الإضافة')}
async function deletePrimary(id){if(countPrimary(id)>0)return toast('التصنيف مستخدم في محفوظات');if(secondariesFor(id).length)return toast('احذف التصنيفات الثانوية أولًا');if(confirm('حذف هذا التصنيف الأساسي؟')){await del('primaryCategories',id);primaryCategories=await getAll('primaryCategories');renderManageTaxonomy();render()}}
async function deleteSecondary(id){if(countSecondary(id)>0)return toast('التصنيف مستخدم في محفوظات');if(confirm('حذف هذا التصنيف الثانوي؟')){await del('secondaryCategories',id);secondaryCategories=await getAll('secondaryCategories');renderManageTaxonomy();render()}}
async function exportBackup(){const data={app:'ClipNest',version:VERSION,exportedAt:now(),primaryCategories,secondaryCategories,cities,items},blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`clipnest-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);toast('تم إنشاء النسخة')}
async function importBackup(file){try{const data=JSON.parse(await file.text());if(!Array.isArray(data.items))throw Error();if(Array.isArray(data.primaryCategories))for(const x of data.primaryCategories)await put('primaryCategories',x);if(Array.isArray(data.secondaryCategories))for(const x of data.secondaryCategories)await put('secondaryCategories',x);if(Array.isArray(data.cities))for(const x of data.cities)await put('cities',x);if(Array.isArray(data.categories))for(const x of data.categories)await put('categories',x);for(const x of data.items)await put('items',x);items=await getAll('items');legacyCategories=await getAll('categories');await seedTaxonomy();await migrateLegacyItems();render();toast('تم الاستيراد')}catch(e){console.error(e);toast('ملف النسخة غير صالح')}}
function installApp(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>deferredPrompt=null);return}const isiOS=/iphone|ipad|ipod/i.test(navigator.userAgent);alert(isiOS?'على iPhone: افتح الرابط في Safari → مشاركة → إضافة إلى الشاشة الرئيسية.':'من قائمة المتصفح اختر تثبيت التطبيق أو Add to Home Screen.')}
async function clearAll(){if(!confirm('سيتم حذف جميع بيانات ClipNest من هذا الجهاز. هل أنت متأكد؟'))return;for(const n of ['items','categories','primaryCategories','secondaryCategories','cities'])await clearStore(n);items=[];legacyCategories=[];primaryCategories=[];secondaryCategories=[];cities=[];await seedTaxonomy();currentPrimary=currentSecondary=currentCity=null;currentView='all';render();toast('تمت إعادة الضبط')}
$('#overlay').onclick=closeSheets;$$('[data-close]').forEach(b=>b.onclick=closeSheets);$('#pickerClose').onclick=()=>$('#pickerSheet').classList.remove('show');$('#addNav').onclick=()=>openItem();$('#menuBtn').onclick=()=>{currentView='settings';currentPrimary=currentSecondary=currentCity=null;render()};$('#pasteBtn').onclick=pasteClipboard;$('#search').oninput=render;$('#saveItem').onclick=saveItem;$('#favoriteToggle').onclick=()=>{editFavorite=!editFavorite;$('#favoriteToggle').textContent=editFavorite?'★ في المفضلة':'☆ إضافة للمفضلة'};$('#pinToggle').onclick=()=>{editPinned=!editPinned;$('#pinToggle').textContent=editPinned?'⌁ مثبّت':'⌁ تثبيت بالأعلى'};
$('#primaryField').onclick=()=>openPicker('primary');$('#secondaryField').onclick=()=>openPicker('secondary');$('#cityField').onclick=()=>openPicker('city');$('#manageParentField').onclick=()=>openPicker('managePrimary');$('#pickerOptions').onclick=e=>{const b=e.target.closest('[data-pick]');if(b)applyPick(b.dataset.pick||'')};$('#pickerAddBtn').onclick=addFromPicker;$('#addPrimaryBtn').onclick=addPrimaryManage;$('#addSecondaryBtn').onclick=addSecondaryManage;
$('#typeFilters').onclick=e=>{const b=e.target.closest('[data-type]');if(!b)return;currentType=b.dataset.type;if(currentView==='settings'){currentView='all'}render()};$('#bottomNav').onclick=e=>{const b=e.target.closest('[data-view]');if(!b)return;currentView=b.dataset.view;currentPrimary=currentSecondary=currentCity=null;render()};$('#taxonomyManageList').onclick=e=>{const p=e.target.closest('[data-del-primary]');if(p)return deletePrimary(p.dataset.delPrimary);const s=e.target.closest('[data-del-secondary]');if(s)return deleteSecondary(s.dataset.delSecondary)};$('#importFile').onchange=e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value=''};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(()=>{}));
(async()=>{await openDB();items=await getAll('items');legacyCategories=await getAll('categories');await seedTaxonomy();await migrateLegacyItems();render()})();
